# Blueprint của Render cho backend. Trên dashboard Render: New → Blueprint → chọn repo GomNang.
# Render đọc file này để tạo service; các biến có `sync: false` sẽ được hỏi lúc tạo — nhập tay, không lưu trong repo.
# Hướng dẫn từng bước: docs/deployment.md

services:
  - type: web
    name: gomnang-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Chuỗi "Session pooler" của Supabase. Có mật khẩu database — chỉ nhập trên dashboard.
      - key: DATABASE_URL
        sync: false
      # Địa chỉ web trên Vercel, ví dụ https://gomnang.vercel.app — không có dấu / ở cuối.
      - key: CORS_ORIGINS
        sync: false
      # Bản demo toàn dữ liệu giả: cho đăng nhập bằng tài khoản mẫu. Đổi thành false để tắt.
      - key: ALLOW_DEMO_LOGIN_IN_PRODUCTION
        value: "true"
      - key: SEED_ON_EMPTY
        value: "true"
