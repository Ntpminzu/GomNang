# Chạy toàn bộ hệ thống giống môi trường deploy: web + API + PostgreSQL thật.
#
#   docker compose up --build        bật (lần đầu build mất vài phút)
#   docker compose down              tắt, GIỮ dữ liệu
#   docker compose down -v           tắt và XOÁ dữ liệu
#
# Cần file .env ở thư mục gốc có JWT_SECRET — xem .env.example.
# Web: http://localhost:3000 · API: http://localhost:4000/health

name: gomnang

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gomnang
      # Mật khẩu chỉ dùng cho container local. Cổng 5432 không mở ra ngoài máy — chỉ API trong cùng mạng Compose gọi được.
      POSTGRES_PASSWORD: gomnang-local-only
      POSTGRES_DB: gomnang
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gomnang -d gomnang"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: be/Dockerfile
    environment:
      # Backend chỉ dùng NODE_ENV để quyết định bật đăng nhập mẫu: production thì luôn tắt.
      # Bản local toàn dữ liệu giả nên để development cho menu "Đang dùng với tài khoản" chạy được.
      NODE_ENV: development
      ENABLE_DEV_LOGIN: "true"
      PORT: "4000"
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET trong file .env ở thư mục gốc repo — xem .env.example}
      # Host không phải Supabase: backend không bật TLS; sslmode=disable ghi rõ điều đó.
      DATABASE_URL: postgres://gomnang:gomnang-local-only@db:5432/gomnang?sslmode=disable
      SEED_ON_EMPTY: "true"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: fe/Dockerfile
      args:
        # Next.js gọi API từ phía server, trong mạng Compose, nên dùng tên service "backend".
        # Trình duyệt chỉ gọi /api cùng địa chỉ http://localhost:3000.
        API_ORIGIN: http://backend:4000
        NEXT_PUBLIC_API_MODE: http
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
